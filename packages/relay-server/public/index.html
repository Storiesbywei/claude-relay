<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Claude Relay</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- SETUP SCREEN -->
  <div id="setup" class="setup">
    <div class="setup-card">
      <div class="setup-brand">
        <h1>Claude Relay</h1>
        <p>Real-time AI collaboration</p>
      </div>

      <div class="setup-section">
        <h2>Create Session</h2>
        <input type="text" id="create-name" placeholder="Session name" value="Director Session">
        <select id="create-ttl">
          <option value="30">30 min</option>
          <option value="60" selected>1 hour</option>
          <option value="480">8 hours</option>
        </select>
        <button id="btn-create" class="btn-primary">Create</button>
      </div>

      <div class="setup-divider"><span>or join existing</span></div>

      <div class="setup-section">
        <h2>Join Session</h2>
        <input type="text" id="join-id" placeholder="Session ID">
        <input type="text" id="join-invite" placeholder="Invite token">
        <input type="text" id="join-name" placeholder="Your name" value="worker">
        <button id="btn-join" class="btn-ghost">Join</button>
      </div>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="main" class="main" style="display:none">
    <!-- Navbar -->
    <nav class="navbar">
      <div class="nav-left">
        <span class="nav-logo">&#9671;</span>
        <span class="nav-title" id="session-name">Claude Relay</span>
        <span class="nav-dot" id="status-dot"></span>
      </div>
      <div class="nav-right">
        <div class="nav-participants" id="participants"></div>
        <button class="btn-icon" id="btn-export" title="Export JSON">&#8595;</button>
        <button class="btn-icon btn-danger" id="btn-end" title="End session">&#10005;</button>
      </div>
    </nav>

    <!-- Invite bar (shown after create) -->
    <div class="invite-bar" id="invite-bar" style="display:none">
      <span>Invite token:</span>
      <code id="invite-token"></code>
      <button class="btn-small" id="btn-copy">Copy</button>
    </div>

    <!-- Content area -->
    <div class="content">
      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-section">
          <h3>Session</h3>
          <div class="info-row"><span>ID</span><code id="info-id">&mdash;</code></div>
          <div class="info-row"><span>Messages</span><span id="info-count">0</span></div>
          <div class="info-row"><span>Expires</span><span id="info-expires">&mdash;</span></div>
        </div>
        <div class="sidebar-section">
          <h3>Participants</h3>
          <ul id="participant-list"></ul>
        </div>
        <div class="sidebar-section">
          <h3>Export</h3>
          <button class="btn-ghost btn-full" id="btn-export-json">&#8595; JSON</button>
          <button class="btn-ghost btn-full" id="btn-export-md">&#8595; Markdown</button>
        </div>
      </aside>

      <!-- Message feed -->
      <div class="feed">
        <div class="messages" id="messages"></div>

        <div class="input-bar">
          <select id="msg-type">
            <option value="question">Question</option>
            <option value="answer">Answer</option>
            <option value="context">Context</option>
            <option value="architecture">Architecture</option>
            <option value="insight">Insight</option>
            <option value="task">Task</option>
          </select>
          <textarea id="msg-input" placeholder="Type a message... (Cmd+Enter to send)" rows="1"></textarea>
          <button id="btn-send" class="btn-primary">Send</button>
        </div>
      </div>
    </div>

    <!-- Status bar -->
    <footer class="statusbar">
      <span id="status-text">Disconnected</span>
      <span id="msg-total">0 messages</span>
    </footer>
  </div>

  <script src="/app.js"></script>
</body>
</html>
